# 统计计算配置
statistic:
  formula:
    # 是否启用公式计算定时任务
    enable-scheduled: true

# RabbitMQ 消费者开关配置
rabbitmq:
  consumer:
    # 是否启用所有 RabbitMQ 消费者
    enable: true

# Leewell 自定义配置
leewell:
  # 超级修复定时任务配置
  super-fix:
    scheduled:
      # 是否启用超级修复定时任务（默认禁用）
      enabled: false
      # 定时任务执行时间（默认每天凌晨1点）
      cron: "0 0 1 * * ?"
      # 每批处理的标签数量
      batch-size: 50
      # 修复策略（INTERPOLATE/FORWARD_FILL/BACKWARD_FILL/ZERO_FILL）
      fix-strategy: INTERPOLATE
      # 是否启用异常检测
      enable-anomaly-detection: true
      # 是否启用缺失检测
      enable-gap-detection: true
      # 是否补全缺失数据
      enable-gap-interpolation: true
      # 是否重算用量
      recalculate-amount: true
      # 是否重算统计
      recalculate-statistics: true
      # 数据间隔(毫秒)
      interval-ms: 60000
      # 标准差倍数阈值
      std-deviation-multiplier: 3.0
      # 每小时最大用量(kWh)
      max-hourly-usage: 100000.0
      # 每天最大用量(kWh)
      max-daily-usage: 1000000.0

  # 数据质量定时任务配置
  data-quality:
    scheduled:
      # 是否启用数据质量定时任务（默认禁用）
      enabled: false
      # 定时任务执行时间（默认每天凌晨2点）
      cron: "0 0 2 * * ?"
      # 每批处理的标签数量
      batch-size: 50
      # 插值方法
      interpolation-method: proportional_scaling
      # 数据间隔(分钟)
      interval-minutes: 1
      # 是否强制重算
      force-recalculate: false

# 并行执行配置（针对32核64线程服务器优化）
parallel-execution:
  # 线程池核心大小（0 表示使用 CPU 核心数的75%，即 64 * 0.75 = 48）
  thread-pool-size: 48
  # 最大线程池大小（峰值时可使用所有线程）
  max-thread-pool-size: 64
  # 线程空闲时间（秒）
  keep-alive-seconds: 60
  # 任务队列大小
  queue-capacity: 200
  # 电量修复批次大小（每次并行处理的 tagName 数量，0 表示不分批，全部并行）
  electricity-fix-batch-size: 0
  # 公式重算批次大小（每层并行处理的公式数量，0 表示不分批，全部并行）
  formula-recalc-batch-size: 0

# 数据稀释自动化配置
data-dilution:
  auto:
    # 是否启用自动稀释
    enabled: true
    # 定时任务cron表达式（默认每天凌晨1点执行）
    cron: "0 0 1 * * ?"
    # 租户ID列表（逗号分隔）
    tenant-ids: "00000001"
  disk:
    # 磁盘占用率上限（百分比）
    high: 85.0
    # 磁盘占用率下限（百分比）
    low: 75.0
  protection:
    # 绝对保护期（天）- 最近N天的数据绝对不稀释
    absolute-days: 90
  strategy:
    # 可稀释期内每天保留的数据条数
    keep-count-per-day: 6
    # 保留年限（年）- 用于计算可稀释期结束时间和兜底删除
    retention-period-years: 3