  accessKeyId:
  accessKeySecret:
install:
  addr: D:\\
  influxdbPath: /home/wlf/leewell-storage/Backup/InfluxDB/
  

# 数据稀释自动化配置
data-dilution:
  auto:
    # 是否启用自动稀释
    enabled: true
    # 定时任务cron表达式（默认每天凌晨1点执行）
    cron: "0 0 1 * * ?"
    # 租户ID列表（逗号分隔）
    tenant-ids: "00000001"
  disk:
    # 磁盘占用率上限（百分比）
    high: 85.0
    # 磁盘占用率下限（百分比）
    low: 75.0
  protection:
    # 绝对保护期（天）- 最近N天的数据绝对不稀释
    absolute-days: 90
  strategy:
    # 可稀释期内每天保留的数据条数
    keep-count-per-day: 6
    # 保留年限（年）- 用于计算可稀释期结束时间和兜底删除
    retention-period-years: 3