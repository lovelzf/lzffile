  tables: sys_position,t_bu_self_diagnosis_abnormal_data_record,t_sys_sensortype,t_sys_moduletype_configuration,t_sys_collectormodetype_configuration,sys_role,t_ba_equipment_type,t_bu_alarm_event_diagnosis,sys_relation,t_bu_modbus_config,t_sys_dict_data,t_sys_collectortype_configuration,t_ba_equipment_treenode_machine_part_diagram,t_sys_dictionary,t_bu_alarm_event,t_bu_collector_selfinspection,sys_org,t_bu_collector_module_sensor_configuration,ems_formula,t_ba_machinetype,t_sys_moduletype_sensortype,t_ba_equipment_treenode_equipment,t_sys_target_expand,t_bu_collector_module_sensor,t_bu_collector_module_sensor_measuring_configuration,t_bu_machine_measuring,t_bu_collector,t_sys_collectortype,t_sys_company_expand,ems_data_entry,t_bu_collector_status,t_ba_equipment_treenode_machine_part,t_bu_collector_configuration,t_sys_measuringtype_configuration,t_bu_alarm_event_dtl,t_bu_report,dev_dict,t_sys_device_gateway,t_sys_modbus_config,t_bu_collector_learning,t_sys_sensortype_measuringtype,t_bu_equipment_treenode_equipment_diagnosis,t_sys_collectortype_hardware,ems_equipment_type_position,t_bu_mod_bus_master,t_ba_treenode_focus,t_bu_alarm_interval,t_bu_collector_module_sensor_measuring,t_sys_protocol,t_ba_equipment_treenode,t_bu_collector_updatefile,t_sys_collectortype_updatefile,t_sys_register_activation,t_sys_collectortype_software,t_sys_collector_software,t_bu_collector_module,sys_user,t_sys_measuringtype,t_ba_equipment_treenode_machine_diagram,t_bu_collector_updatefile_plan,t_bu_equipment_treenode_point_part,t_sys_collectortype_moduletype,t_ba_equipment_treenode_machine_part_configuration,t_bu_collector_module_modbus,t_bu_equipment_treenode_point,t_ba_equipment_treenode_machine,t_sys_sensortype_configuration,ems_indicators,t_bu_device_account,t_sys_collectormodetype,t_sys_network_config,t_bu_mod_bus_master_slave_config,t_bu_collector_module_configuration,t_sys_moduletype,dev_file,t_bu_collector_module_trigger,t_bu_equipment_treenode_point_collector,t_bu_device_acc
  ignoreTables: dev_log,dev_config
  #  项目名称，用于区分不同项目，备份的文件夹会以项目名称开头
  projectName: local
  autoBackup:
    #    是否开启自动备份
    enableAutoBackup: false
    #    是否开启上传文件（阿里OSS）
    enableUpload: false
    #    自动备份的七子表达式，0 0 1 1 * ? 标识每月1日的1:00:00开始备份
    cron: "0 0 1 1 * ?"
    #    最大保留备份数量
    maxBackupItem: 3
    #    正数表示天、负数表示月
    dateRange: -1
    #    正数表示天、负数表示月
    offsetDay: 0
