#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
	include conf.d/*.conf;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;
    access_log  logs/host.access.log  main;
	error_log D:/IMP-platform/nginx/logs/error.log;
    keepalive_timeout  65;
	client_max_body_size 100m;
	

    server {
        listen       9201;
		listen  [::]:9201;
		server_name  ISS-Platform;

       add_header Access-Control-Allow-Origin *;
       add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';

        location / {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
			 root   static/ISS-Platform;
             index  index.html index.htm;
             try_files $uri $uri/ /index.html;
        }  
		
		location ^~ /baseServerApi/ {
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
			add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
			add_header Access-Control-Allow-Credentials true;
			
			# ����OPTIONSԤ������
			if ($request_method = 'OPTIONS') {
				return 204;
			}
			
			proxy_pass http://127.0.0.1:9200/;
		}
		
		location ^~ /waveServerApi/ {
			proxy_pass http://127.0.0.1:8830/;
		}
		
		location ^~ /dataDilutionServerApi/ {
			proxy_pass http://10.150.78.6:8886/;
		}

		location ^~ /jmreport/ {
			proxy_pass http://10.150.78.6/jmreport/;
		}
		
		location ^~ /wsServerApi/ {
                           proxy_pass http://127.0.0.1:9200/;
                            proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "Upgrade";
                        proxy_set_header Host $host;
                }
		error_page   500 502 503 504  /50x.html;
			location = /50x.html {
			root   static/ISS-Platform;
		}
    }
	
