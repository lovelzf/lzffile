#服务配置
server:
  port: 8886
  max-http-header-size: 10240
  compression:
    enabled: true
    min-response-size: 10KB
    mime-types: application/json

#spring相关配置
spring:
  profiles:
    active: prod
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    locale: zh_CN
    serialization:
      # 格式化输出
      indent_output: false